<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonverter - 节点转换与编组工具</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Cdefs%3E%3ClinearGradient%20id='bg'%20x1='0%25'%20y1='0%25'%20x2='100%25'%20y2='100%25'%3E%3Cstop%20offset='0%25'%20stop-color='%234f46e5'/%3E%3Cstop%20offset='50%25'%20stop-color='%236366f1'/%3E%3Cstop%20offset='100%25'%20stop-color='%23818cf8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width='64'%20height='64'%20rx='16'%20fill='url(%23bg)'/%3E%3Cpath%20d='M36%206%20L18%2034%20L32%2034%20L26%2058%20L48%2028%20L34%2028%20Z'%20fill='%23ffffff'%20stroke='%23ffffff'%20stroke-width='2'%20stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="alternate icon" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      /* 浅色主题 (Glassmorphism & Clean Ambient) */
      --bg-base: #f4f6fb;
      --bg-ambient-1: rgba(99, 102, 241, 0.08);
      --bg-ambient-2: rgba(236, 72, 153, 0.06);
      --bg-ambient-3: rgba(14, 165, 233, 0.08);

      --glass-surface: rgba(255, 255, 255, 0.8);
      --glass-surface-subtle: rgba(255, 255, 255, 0.55);
      --glass-surface-hover: rgba(255, 255, 255, 0.95);
      --glass-border: rgba(226, 232, 240, 0.85);
      --glass-border-focus: rgba(99, 102, 241, 0.4);

      --text-main: #0f172a;
      --text-muted: #475569;
      --text-subtle: #94a3b8;

      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: rgba(99, 102, 241, 0.1);
      --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #6366f1 50%, #818cf8 100%);
      --accent: #06b6d4;

      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.1);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.1);

      --drop-bg: rgba(248, 250, 252, 0.7);
      --drop-border: rgba(203, 213, 225, 0.9);
      --drop-border-active: #6366f1;

      --code-bg: #0f172a;
      --code-text: #e2e8f0;

      --shadow-sm: 0 2px 8px -2px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 12px 24px -6px rgba(15, 23, 42, 0.06), 0 4px 8px -2px rgba(15, 23, 42, 0.03);
      --shadow-lg: 0 24px 48px -12px rgba(15, 23, 42, 0.1), 0 0 0 1px rgba(255, 255, 255, 0.8);
      --shadow-glow: 0 0 30px rgba(99, 102, 241, 0.2);

      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-pill: 9999px;
    }

    [data-theme="dark"] {
      /* 深色主题 (Obsidian Glass & Cosmic Glow) */
      --bg-base: #090d16;
      --bg-ambient-1: rgba(99, 102, 241, 0.12);
      --bg-ambient-2: rgba(217, 70, 239, 0.08);
      --bg-ambient-3: rgba(14, 165, 233, 0.1);

      --glass-surface: rgba(18, 24, 38, 0.75);
      --glass-surface-subtle: rgba(24, 32, 50, 0.5);
      --glass-surface-hover: rgba(30, 41, 64, 0.8);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-border-focus: rgba(99, 102, 241, 0.5);

      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-subtle: #64748b;

      --primary: #6366f1;
      --primary-hover: #818cf8;
      --primary-light: rgba(99, 102, 241, 0.15);
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #818cf8 50%, #a5b4fc 100%);
      --accent: #22d3ee;

      --success: #34d399;
      --success-bg: rgba(52, 211, 153, 0.12);
      --danger: #f87171;
      --danger-bg: rgba(248, 113, 113, 0.12);

      --drop-bg: rgba(15, 23, 42, 0.5);
      --drop-border: rgba(255, 255, 255, 0.12);
      --drop-border-active: #818cf8;

      --code-bg: #070b12;
      --code-text: #f1f5f9;

      --shadow-sm: 0 2px 8px -2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 12px 28px -6px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 24px 48px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.06);
      --shadow-glow: 0 0 35px rgba(99, 102, 241, 0.28);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
      transition: background-color 0.3s cubic-bezier(0.4, 0, 0.2, 1), color 0.3s;
    }

    /* 环境氛围渐变光源 */
    .ambient-glow {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .glow-orb-1 {
      position: absolute;
      top: -120px;
      left: 15%;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--bg-ambient-1) 0%, transparent 70%);
      filter: blur(60px);
    }

    .glow-orb-2 {
      position: absolute;
      top: 20%;
      right: -100px;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--bg-ambient-2) 0%, transparent 70%);
      filter: blur(80px);
    }

    .glow-orb-3 {
      position: absolute;
      bottom: 5%;
      left: 20%;
      width: 550px;
      height: 550px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--bg-ambient-3) 0%, transparent 70%);
      filter: blur(70px);
    }

    /* 顶部导航栏 */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: var(--glass-surface);
      border-bottom: 1px solid var(--glass-border);
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 32px;
      box-shadow: var(--shadow-sm);
    }

    .header-inner {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--primary-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
      flex-shrink: 0;
    }

    .brand-text h1 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid rgba(99, 102, 241, 0.2);
    }

    .brand-text p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: -1px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
      padding: 6px 12px;
      background: var(--glass-surface-subtle);
      border-radius: var(--radius-pill);
      border: 1px solid var(--glass-border);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .theme-toggle-btn {
      background: var(--glass-surface-subtle);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      width: 38px;
      height: 38px;
      border-radius: var(--radius-md);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .theme-toggle-btn:hover {
      background: var(--glass-surface-hover);
      border-color: var(--glass-border-focus);
      transform: translateY(-1px);
    }

    /* 主容器 */
    .app-main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 28px auto;
      padding: 0 24px;
      display: flex;
      gap: 24px;
      align-items: flex-start;
      position: relative;
      z-index: 1;
    }

    /* 侧边导航栏 */
    .sidebar-nav {
      width: 250px;
      flex-shrink: 0;
      background: var(--glass-surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: var(--radius-lg);
      padding: 12px;
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-md);
    }

    .sidebar-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-subtle);
      padding: 8px 12px 6px;
    }

    .nav-tab {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-main);
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      margin-bottom: 4px;
    }

    .nav-tab:hover {
      background: var(--glass-surface-hover);
      border-color: var(--glass-border);
    }

    .nav-tab.active {
      background: var(--primary-light);
      border-color: rgba(99, 102, 241, 0.25);
      color: var(--primary);
      box-shadow: 0 2px 10px rgba(99, 102, 241, 0.1);
    }

    .nav-tab-icon {
      font-size: 20px;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--glass-surface-subtle);
      flex-shrink: 0;
    }

    .nav-tab.active .nav-tab-icon {
      background: rgba(99, 102, 241, 0.15);
    }

    .nav-tab-info {
      flex: 1;
      min-width: 0;
    }

    .nav-tab-name {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.2;
    }

    .nav-tab-desc {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .nav-tab.active .nav-tab-desc {
      color: var(--primary);
      opacity: 0.85;
    }

    /* 内容主体 */
    .content-area {
      flex: 1;
      min-width: 0;
    }

    .glass-card {
      background: var(--glass-surface);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: var(--radius-lg);
      padding: 32px;
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-lg);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      margin-bottom: 24px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
    }

    .card-header h2 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.4px;
      color: var(--text-main);
    }

    .card-header p {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .card-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      background: rgba(6, 182, 212, 0.1);
      border: 1px solid rgba(6, 182, 212, 0.2);
      padding: 4px 10px;
      border-radius: var(--radius-pill);
    }

    /* 订阅 URL 输入区域 */
    .url-input-card {
      margin-bottom: 16px;
    }

    .url-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      background: var(--glass-surface-subtle);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 4px 14px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: var(--shadow-sm);
    }

    .url-input-wrapper:focus-within {
      border-color: var(--drop-border-active);
      background: var(--glass-surface);
      box-shadow: 0 0 0 3px var(--primary-light), var(--shadow-md);
    }

    .url-icon {
      font-size: 18px;
      margin-right: 10px;
      opacity: 0.8;
      user-select: none;
    }

    .url-input-field {
      flex: 1;
      height: 42px;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 14px;
      font-family: inherit;
    }

    .url-input-field::placeholder {
      color: var(--text-subtle);
    }

    .url-clear-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 13px;
      padding: 4px 8px;
      border-radius: var(--radius-pill);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .url-clear-btn:hover {
      background: rgba(0, 0, 0, 0.08);
      color: var(--text-main);
    }

    /* 分隔线 */
    .or-separator {
      display: flex;
      align-items: center;
      margin: 16px 0;
      gap: 12px;
    }

    .or-line {
      flex: 1;
      height: 1px;
      background: var(--glass-border);
    }

    .or-text {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-subtle);
      letter-spacing: 0.5px;
    }

    /* 拖拽上传区域 */
    .drop-box {
      border: 2px dashed var(--drop-border);
      border-radius: var(--radius-lg);
      padding: 44px 24px;
      text-align: center;
      background: var(--drop-bg);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }

    .drop-box:hover,
    .drop-box.dragover {
      border-color: var(--drop-border-active);
      background: var(--primary-light);
      transform: translateY(-2px);
      box-shadow: var(--shadow-glow);
    }

    .drop-icon-wrapper {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      color: var(--primary);
      font-size: 26px;
      transition: transform 0.25s;
    }

    .drop-box:hover .drop-icon-wrapper {
      transform: scale(1.08) translateY(-2px);
    }

    .drop-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .drop-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .drop-format-pill {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-subtle);
      background: var(--glass-surface-subtle);
      border: 1px solid var(--glass-border);
      padding: 3px 10px;
      border-radius: var(--radius-pill);
    }

    /* 已选文件卡片 */
    .file-preview-card {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 20px;
      background: var(--glass-surface-subtle);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }

    .file-preview-info {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .file-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--primary-light);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .file-details {
      min-width: 0;
    }

    .file-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-size-badge {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .file-remove-btn {
      color: var(--danger);
      background: transparent;
      border: none;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background 0.15s;
    }

    .file-remove-btn:hover {
      background: var(--danger-bg);
    }

    /* 主操作按钮 */
    .btn-action-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 46px;
      border-radius: var(--radius-md);
      background: var(--primary-gradient);
      color: #ffffff;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.35);
    }

    .btn-action-primary:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(99, 102, 241, 0.45);
    }

    .btn-action-primary:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-action-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* 错误提示 */
    .alert-banner {
      display: none;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.2);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 20px;
      align-items: center;
      gap: 8px;
    }

    .alert-banner.show {
      display: flex;
    }

    /* 结果区域 */
    .results-container {
      display: none;
      margin-top: 32px;
      padding-top: 28px;
      border-top: 1px solid var(--glass-border);
    }

    .results-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 20px;
    }

    .results-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--success);
      background: var(--success-bg);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 6px 14px;
      border-radius: var(--radius-pill);
    }

    .results-action-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 36px;
      padding: 0 16px;
      border-radius: var(--radius-md);
      background: var(--glass-surface-subtle);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-secondary:hover {
      background: var(--glass-surface-hover);
      border-color: var(--glass-border-focus);
      transform: translateY(-1px);
    }

    /* 订阅与预览链接展示条 */
    .sub-link-box {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      padding: 10px 14px;
      background: var(--glass-surface-subtle);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }

    .sub-link-badge {
      font-size: 11px;
      font-weight: 600;
      color: var(--primary);
      background: var(--primary-light);
      padding: 3px 8px;
      border-radius: var(--radius-pill);
      white-space: nowrap;
    }

    .sub-link-input {
      flex: 1;
      height: 32px;
      padding: 0 10px;
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 12px;
      outline: none;
    }
