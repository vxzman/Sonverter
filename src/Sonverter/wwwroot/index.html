<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonverter - Singbox 出口节点转换工具</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: 700px;
      width: 100%;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 10px;
      font-size: 24px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .upload-area {
      border: 2px dashed #667eea;
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      background: #f8f9ff;
    }

    .upload-area:hover {
      border-color: #764ba2;
      background: #f0f2ff;
    }

    .upload-area.dragover {
      border-color: #764ba2;
      background: #e8ebff;
    }

    .upload-icon {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .upload-text {
      color: #667eea;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .upload-hint {
      color: #999;
      font-size: 13px;
    }

    #fileInput {
      display: none;
    }

    .file-info {
      margin-top: 20px;
      padding: 15px;
      background: #f0f2ff;
      border-radius: 8px;
      display: none;
    }

    .file-info.show {
      display: block;
    }

    .file-name {
      color: #333;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .file-size {
      color: #666;
      font-size: 13px;
    }

    .convert-btn {
      width: 100%;
      padding: 15px;
      margin-top: 25px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .convert-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    .convert-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .result-area {
      margin-top: 25px;
      padding: 20px;
      background: #f8f9ff;
      border-radius: 8px;
      display: none;
    }

    .result-area.show {
      display: block;
    }

    .result-title {
      color: #333;
      font-weight: 600;
      margin-bottom: 15px;
      text-align: center;
    }

    .download-btns {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .download-btn {
      padding: 12px 20px;
      background: white;
      color: #667eea;
      border: 2px solid #667eea;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .download-btn:hover {
      background: #667eea;
      color: white;
    }

    .stats {
      margin-top: 15px;
      padding: 15px;
      background: white;
      border-radius: 8px;
      font-size: 13px;
      color: #666;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .stats-row:last-child {
      border-bottom: none;
    }

    .stats-label {
      color: #999;
    }

    .stats-value {
      color: #333;
      font-weight: 600;
    }

    .error-msg {
      color: #e74c3c;
      background: #fdeaea;
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      font-size: 14px;
      display: none;
    }

    .error-msg.show {
      display: block;
    }
  </style>
  <script type="module" crossorigin src="/assets/index-BSKS-KOu.js"></script>
</head>
<body>
  <div class="container">
    <h1>🌍 Sonverter · Singbox 出口节点转换工具</h1>
    <p class="subtitle">添加 emoji 前缀 · 按国家/地区分组</p>

    <div id="singbox-content">
      <div class="upload-area" id="uploadArea">
        <div class="upload-icon">📁</div>
        <div class="upload-text">点击选择文件或拖拽文件到此处</div>
        <div class="upload-hint">支持 JSON 格式的节点配置文件</div>
        <input type="file" id="fileInput" accept=".json">
      </div>

      <div class="file-info" id="fileInfo">
        <div class="file-name" id="fileName"></div>
        <div class="file-size" id="fileSize"></div>
      </div>

      <div class="error-msg" id="errorMsg"></div>

      <button class="convert-btn" id="convertBtn" disabled>开始转换</button>

      <div class="result-area" id="resultArea">
        <div class="result-title">✅ 转换完成</div>
        <div class="download-btns">
          <a class="download-btn" id="downloadConverted" download>
            💾 下载转换结果
          </a>
        </div>
        <div class="stats" id="stats"></div>
      </div>
    </div>
  </div>

</body>
</html>
